<!-- @dsCard group="Spacing" viewport="700x150" subtitle="One easing; rules draw in, content rises" name="Motion" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);color:var(--text-1);font-family:var(--font-body);-webkit-font-smoothing:antialiased;padding:20px;box-sizing:border-box}a{color:var(--gold)}a:hover{color:var(--gold-hover)}</style><style>@keyframes grow{from{width:0}to{width:200px}}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}</style>
<div style="animation:rise 0.7s cubic-bezier(0.2,0.7,0.3,1) both"><div style="width:200px;height:38px;background:var(--photo-frame);border-radius:4px"></div><div style="height:8px;width:200px;background:var(--gold);border-radius:4px;margin-top:8px;animation:grow 1.1s 0.4s cubic-bezier(0.2,0.7,0.3,1) both"></div><div style="height:8px;width:124px;background:var(--text-dim);border-radius:4px;margin-top:6px;animation:grow 1.1s 0.7s cubic-bezier(0.2,0.7,0.3,1) both"></div></div>
<div style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-5);margin-top:12px">--ease-brand: cubic-bezier(0.2, 0.7, 0.3, 1) · entrances run once</div>
